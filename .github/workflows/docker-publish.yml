name: Publish Docker image

# Builds the image and pushes it to GitHub's container registry (GHCR) on every
# push to main and on version tags, so users can `docker run`/`compose up` a
# prebuilt image without cloning or building. No secrets to configure — the
# built-in GITHUB_TOKEN is enough.
#
# First-time note: after the first successful run, open the package under your
# repo → Packages and set its visibility to Public so others can pull it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A release is only announced to users if the tag and the version in the
      # code agree. Tag v0.2.0 while __init__.py still says 0.1.0 and everyone
      # who upgrades keeps being told "v0.2.0 is out" forever, because their
      # running version never catches up. Fail here rather than ship that.
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('h1monitor/__init__.py').read_text()).group(1))")"
          if [ "$tag" != "$code" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${code} in h1monitor/__init__.py"
            echo "Bump __version__ to ${tag} and retag, or users who upgrade will be told an update is available forever."
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches __version__ ${code}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
